services:
  mesflow-qa-center:
    # This is the deployment-target compose file (Build Once / Promote Same
    # Artifact): no `build:` block on purpose -- it only ever runs the exact
    # immutable image already built on DEV, `--no-build`. For local
    # source-bind-mounted development, use docker/compose.yml instead (that
    # one is unaffected by this file).
    image: ${MESFLOW_QA_IMAGE:-mesflow-qa-center:1.31.0}
    container_name: mesflow-qa-center
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MESFLOW_QA_HOST: 0.0.0.0
      MESFLOW_QA_PORT: "8095"
      MESFLOW_QA_CONFIG_PATH: /data/config.json
      MESFLOW_QA_LOG_DIR: /data/logs
      MESFLOW_QA_REPORT_DIR: /data/reports
      MESFLOW_QA_STATE_DIR: /data/state
      MESFLOW_QA_RUNTIME_DIR: /data
      MESFLOW_QA_INTERNAL_ONLY: "1"
      MESFLOW_QA_INTERNAL_URL: ${MESFLOW_QA_INTERNAL_URL:-http://mesflow-app:8080}
      MESFLOW_QA_DEMO_TARGET_URL: ${MESFLOW_QA_DEMO_TARGET_URL:-http://mesflow-app:8080}
      MESFLOW_QA_PROFILE: ${MESFLOW_QA_PROFILE:-LOCAL}
      MESFLOW_QA_USERNAME: ${MESFLOW_QA_USERNAME:-admin}
      # Allow the dashboard to start before credentials are configured -- the
      # app itself rejects starting/resuming a real QA run when this is empty.
      MESFLOW_QA_PASSWORD: ${MESFLOW_QA_PASSWORD:-}
      MESFLOW_QA_DURATION_MINUTES: ${MESFLOW_QA_DURATION_MINUTES:-30}
      MESFLOW_QA_API_WORKERS: ${MESFLOW_QA_API_WORKERS:-10}
      MESFLOW_QA_AUTO_RESUME: "1"
      MESFLOW_QA_DATABASE_URL: ${MESFLOW_QA_DATABASE_URL:-}
      MESFLOW_QA_DB_ADMIN_URL: ${MESFLOW_QA_DB_ADMIN_URL:-}
      MESFLOW_QA_TEMPLATE_DATABASE: ${MESFLOW_QA_TEMPLATE_DATABASE:-mesflow_qa_template}
      MESFLOW_QA_DB_ALLOW_RESET: ${MESFLOW_QA_DB_ALLOW_RESET:-1}
      MESFLOW_QA_DB_ALLOWED_NAMES: ${MESFLOW_QA_DB_ALLOWED_NAMES:-mesflow_qa,mesflow_test,mesflow_demo}
      MESFLOW_QA_DEMO_SOURCE_DATABASE: ${MESFLOW_QA_DEMO_SOURCE_DATABASE:-mesflow}
      MESFLOW_QA_DEMO_DATABASE: ${MESFLOW_QA_DEMO_DATABASE:-mesflow_demo}
      MESFLOW_QA_DEMO_TEMPLATE_DATABASE: ${MESFLOW_QA_DEMO_TEMPLATE_DATABASE:-mesflow_demo_template}
      MESFLOW_QA_DB_ALLOWED_HOSTS: ${MESFLOW_QA_DB_ALLOWED_HOSTS:-mesflow-postgres,postgres,127.0.0.1,localhost}
      MESFLOW_QA_DB_MIN_EMPLOYEES: ${MESFLOW_QA_DB_MIN_EMPLOYEES:-26}
      MESFLOW_QA_DB_MIN_WORK_SHIFTS: ${MESFLOW_QA_DB_MIN_WORK_SHIFTS:-2}
      MESFLOW_QA_DB_MIN_SHIFT_INTERVALS: ${MESFLOW_QA_DB_MIN_SHIFT_INTERVALS:-4}
      MESFLOW_QA_DB_MIN_TEMPLATES: ${MESFLOW_QA_DB_MIN_TEMPLATES:-1}
      MESFLOW_QA_DB_MIN_USERS: ${MESFLOW_QA_DB_MIN_USERS:-1}
      MESFLOW_QA_BACKUP_DIR: /data/backups
      MESFLOW_QA_MES_RETRY_SECONDS: "30"
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MESFLOW_QA_BIND:-0.0.0.0}:${MESFLOW_QA_PORT:-8095}:8095"
    volumes:
      - ./runtime:/data
      # Docker-outside-of-Docker for the UI Preview Lab (engine/preview_manager.py):
      # QA Center shells out to `docker` on the HOST daemon to stand up its own
      # isolated app+db+network per preview environment. Same pattern deploy-agent
      # already uses. Every resource that code creates is labeled/guarded --
      # see engine/preview_guard.py -- and it never touches mesflow-app/mesflow-postgres.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8095/api/version"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - mesflow-edge
      - mesflow_network

networks:
  mesflow-edge:
    external: true
  mesflow_network:
    external: true
